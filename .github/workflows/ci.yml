name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Build fixture bundle
        run: uv run python scripts/build_fixture_bundle.py

      - name: Run unit and contract tests
        run: uv run pytest -q

      - name: Stranger smoke (fixture analyst)
        run: uv run alphaguard smoke --fixture-analyst
