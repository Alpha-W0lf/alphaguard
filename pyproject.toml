[project]
name = "alphaguard"
version = "0.1.0"
description = "AlphaGuard — replay-first interview lab (vertical slice)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "xgboost>=2.0",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "qdrant-client>=1.11",
  "sentence-transformers>=3.0",
  "python-dotenv>=1.0",
  "kafka-python>=2.0",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "yfinance>=0.2",
  "exchange-calendars>=4.5",
  "transformers>=4.40",
  "langsmith>=0.10.2",
  "arize-phoenix-otel>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
alphaguard = "alphaguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaguard"]

[tool.hatch.build.targets.sdist]
include = ["src/alphaguard", "data/fixtures", "README.md"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "kafka_integration: requires docker compose Kafka+Qdrant (excluded by default)",
  "rss_live: optional live Yahoo RSS probe (excluded by default; set ALPHAGUARD_RUN_RSS_LIVE=1)",
  "langsmith_live: optional live LangSmith emit (excluded by default; set ALPHAGUARD_RUN_LANGSMITH_LIVE=1)",
  "phoenix_live: optional live Phoenix emit (excluded by default; set ALPHAGUARD_RUN_PHOENIX_LIVE=1)",
]
addopts = "-m 'not kafka_integration and not rss_live and not langsmith_live and not phoenix_live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
